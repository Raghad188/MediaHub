<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="auth-box">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flash-list">
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
    {% endwith %}

    <h1>Login</h1>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <br>

    <p>
        Don't have an account?
    </p>

    <br>

    <a href="/register">

        <button>
            Register
        </button>

    </a>

</div>

</body>
</html>
